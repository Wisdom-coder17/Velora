<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Admin — VÉLORA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="store-pages.css"></head><body><header class="site-header"><a class="wordmark" href="index.html">VÉLORA<span>®</span></a><nav class="main-nav"><a href="items.html">View store</a><a href="index.html">Home</a></nav></header><main class="store-page admin-page"><p class="eyebrow">STORE MANAGEMENT</p><h1>Admin <em>studio.</em></h1><p class="page-intro">Add, edit and remove products from this browser's local catalogue.</p><div class="admin-layout"><form id="productForm" class="admin-form"><h2 id="formTitle">Add a product</h2><input type="hidden" id="productId"><label>Product name<input id="name" required></label><label>Category<select id="category"><option>Tops</option><option>Outerwear</option><option>Bottoms</option><option>Accessories</option></select></label><label>Price (₦)<input id="price" type="number" min="0" required></label><label>Image URL<input id="image" type="url" placeholder="https://..." required></label><label>Short details<input id="note" required></label><label>Description<textarea id="description" rows="3"></textarea></label><label>Colours (comma separated)<input id="colors" placeholder="Black, Cream, Olive" required></label><div class="admin-actions"><button class="button button-dark" type="submit">Save product</button><button class="button button-outline" type="button" id="resetForm">Clear</button></div><p class="admin-hint">Changes are saved in localStorage on this device and browser only.</p></form><section class="admin-products"><h2>Products <span id="productCount"></span></h2><div id="adminList"></div></section></div></main><script src="store-data.js"></script><script src="admin.js"></script></body></html>
